# docker-compose.yml — LOCAL DEVELOPMENT ONLY
# Untuk VPS/production gunakan docker-compose.prod.yml
# WSL2 Ubuntu / macOS + Docker Desktop
#
# Services: postgres + redis + mediamtx (CCTV simulation stream)
# Laravel app server + queue worker dijalankan langsung di host: php artisan serve

version: '3.8'

services:

  # ─── PostgreSQL 15 — sama versi dengan production ─────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: minetra_postgres_local
    restart: unless-stopped
    environment:
      POSTGRES_DB:       minetra_local
      POSTGRES_USER:     minetra
      POSTGRES_PASSWORD: minetra_local_pass
    ports:
      - '5432:5432'
    volumes:
      - minetra_pg_local:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minetra -d minetra_local']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minetra-local

  # ─── Redis 7 — cache, queue, sessions ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: minetra_redis_local
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - minetra_redis_local:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - minetra-local

  # ─── MediaMTX — RTSP-to-HLS bridge + CCTV simulation stream ─────────────
  # bluenviron/mediamtx:latest-ffmpeg sudah include ffmpeg built-in
  # Generates 3 test pattern streams (cam_gate1, cam_wet, cam_warehouse)
  # HLS: http://localhost:8888/{stream}/index.m3u8
  # API: http://localhost:9997/v3/paths/list
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: minetra_mediamtx_local
    restart: unless-stopped
    ports:
      - '8554:8554'   # RTSP (untuk ffmpeg snapshot di job)
      - '8888:8888'   # HLS (diakses browser di CctvMonitor.vue)
      - '8889:8889'   # WebRTC (optional)
      - '9997:9997'   # MediaMTX REST API (stream status)
    volumes:
      - ./docker/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - minetra-local

volumes:
  minetra_pg_local:
    driver: local
  minetra_redis_local:
    driver: local

networks:
  minetra-local:
    driver: bridge

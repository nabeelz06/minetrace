# docker-compose.prod.yml
# Konfigurasi production — berbeda dengan dev (tanpa volume mount code)

version: '3.9'

services:

  # ─── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: minetra_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d/app.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - minetra_net

  # ─── Laravel Application ───────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: minetra_app
    env_file: .env.production
    volumes:
      - ./:/var/www/html
      - app_storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - minetra_net

  # ─── PostgreSQL 15 ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: minetra_db
    environment:
      POSTGRES_DB:       minetra_db
      POSTGRES_USER:     minetra_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minetra_user -d minetra_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - minetra_net
    # Jangan expose port 5432 ke public!

  # ─── Redis Cache ──────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: minetra_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - minetra_net

  # ─── Laravel Queue Worker ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: production
    container_name: minetra_worker
    env_file: .env.production
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      - db
      - redis
    restart: unless-stopped
    networks:
      - minetra_net

  # ─── Certbot SSL (Let's Encrypt) ──────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: minetra_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    restart: unless-stopped

volumes:
  db_data:
  redis_data:
  app_storage:
  certbot_www:
  certbot_conf:

networks:
  minetra_net:
    driver: bridge
# docker/nginx/conf.d/app.prod.conf

# ── Redirect HTTP → HTTPS ──────────────────────────────────────
server {
    listen 80;
    server_name mining-traceability.com www.mining-traceability.com;

    # Certbot challenge (untuk SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Main HTTPS Server ──────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name mining-traceability.com www.mining-traceability.com;
    root /var/www/html/public;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/mining-traceability.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mining-traceability.com/privkey.pem;

    # SSL Security Headers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;
    charset utf-8;

    # Increase upload size (untuk laporan/export)
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Static files (cache agresif) ──────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── CCTV HLS — reverse proxy ke MediaMTX (jaringan Docker internal) ──
    # Menjaga HLS tetap di balik HTTPS yang sama (hindari mixed-content
    # block di browser saat HLS.js fetch .m3u8/.ts dari halaman https://).
    # CCTV_HLS_BASE_URL di .env.production HARUS diarahkan ke path ini,
    # bukan langsung ke port mediamtx.
    location /hls/ {
        proxy_pass http://mediamtx:8888/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cookie_path / /;
        proxy_buffering off;
        add_header Cache-Control "no-cache" always;
    }

    # ── API RFID — CORS untuk ESP32 ───────────────────────────
    location /api/rfid/ {
        add_header 'Access-Control-Allow-Origin'  '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-Rfid-Token' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Max-Age' 86400;
            add_header 'Content-Length' 0;
            return 204;
        }

        try_files $uri $uri/ /index.php?$query_string;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # ── Laravel routes ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;
}
# mediamtx.yml — MediaMTX config untuk MINETRA local dev
# RTSP-to-HLS/WebRTC bridge dengan 3 CCTV simulation stream
# Image: bluenviron/mediamtx:latest-ffmpeg (ffmpeg built-in)

# ── Ports ──────────────────────────────────────────────────────────────────────
rtspAddress:    :8554
rtmpAddress:    :1935
hlsAddress:     :8888
webrtcAddress:  :8889
apiAddress:     :9997

# ── Security — no auth for local dev ──────────────────────────────────────────
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# ── API ────────────────────────────────────────────────────────────────────────
api:     yes
metrics: yes
metricsAddress: :9998

# ── Logging ────────────────────────────────────────────────────────────────────
logLevel:        warn
logDestinations: [stdout]

# ── HLS ────────────────────────────────────────────────────────────────────────
hls:                yes
# mediamtx v1.9.0+ menggunakan Low-Latency HLS (LL-HLS) sebagai default.
# LL-HLS membutuhkan hlsSegmentCount >= 7. Nilai 3 menyebabkan error:
# "Low-Latency HLS requires at least 7 segments" → muxer instance destroyed → 500.
hlsSegmentCount:    7
hlsSegmentDuration: 1s
hlsPartDuration:    200ms
#
# hlsAllowOrigins (plural list) — canonical form sejak mediamtx v1.9.0.
# hlsAllowOrigin (singular string) adalah deprecated dan DIABAIKAN oleh
# v1.9.0+, menyebabkan mediamtx fallback ke ACAO: * yang tidak kompatibel
# dengan withCredentials: true (CORS spec melarang ACAO:* + credentials).
hlsAllowOrigins:
  - 'http://localhost:8000'
  - 'http://localhost:5173'
hlsEncryption:      no

# ── WebRTC ─────────────────────────────────────────────────────────────────────
webrtc: yes

# ── Camera Paths ───────────────────────────────────────────────────────────────
paths:

  # ── SIMULATION STREAM 1 — Gate Receiving Area ──────────────────────────────
  # testsrc2 dengan warna berbeda per kamera (no font deps)
  cam_gate1:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=blue@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_gate1
    runOnInitRestart: yes

  # ── SIMULATION STREAM 2 — Wet Process Area ─────────────────────────────────
  cam_wet:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=green@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_wet
    runOnInitRestart: yes

  # ── SIMULATION STREAM 3 — LTJ Warehouse ────────────────────────────────────
  cam_warehouse:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=red@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_warehouse
    runOnInitRestart: yes

  # ── PRODUCTION — Actual TP-Link Tapo C500 ──────────────────────────────────
  cam_gate1_real:
    source:                       rtsp://admin_minetra:Tapo123!@192.168.18.38/stream2
    sourceOnDemand:               yes
    sourceOnDemandStartTimeout:   15s
    sourceOnDemandCloseAfter:     60s
    sourceProtocol:               tcp

# mediamtx.yml — MediaMTX config untuk MINETRA local dev
# RTSP-to-HLS/WebRTC bridge — 3 simulation stream (cam_gate1, cam_wet,
# cam_warehouse) + 1 live proxy kamera fisik asli (live_gate1)
# Image: bluenviron/mediamtx:latest-ffmpeg (ffmpeg built-in)

# ── Ports ──────────────────────────────────────────────────────────────────────
rtspAddress:    :8554
rtmpAddress:    :1935
hlsAddress:     :8888
webrtcAddress:  :8889
apiAddress:     :9997

# ── Security — no auth for local dev ──────────────────────────────────────────
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# ── API ────────────────────────────────────────────────────────────────────────
api:     yes
metrics: yes
metricsAddress: :9998

# ── Logging ────────────────────────────────────────────────────────────────────
logLevel:        warn
logDestinations: [stdout]

# ── HLS ────────────────────────────────────────────────────────────────────────
hls:                yes
# mediamtx v1.9.0+ menggunakan Low-Latency HLS (LL-HLS) sebagai default.
# LL-HLS membutuhkan hlsSegmentCount >= 7. Nilai 3 menyebabkan error:
# "Low-Latency HLS requires at least 7 segments" → muxer instance destroyed → 500.
hlsSegmentCount:    7
hlsSegmentDuration: 1s
hlsPartDuration:    200ms
#
# hlsAllowOrigins (plural list) — canonical form sejak mediamtx v1.9.0.
# hlsAllowOrigin (singular string) adalah deprecated dan DIABAIKAN oleh
# v1.9.0+, menyebabkan mediamtx fallback ke ACAO: * yang tidak kompatibel
# dengan withCredentials: true (CORS spec melarang ACAO:* + credentials).
hlsAllowOrigins:
  - 'http://localhost:8000'
  - 'http://localhost:5173'
hlsEncryption:      no

# ── WebRTC ─────────────────────────────────────────────────────────────────────
webrtc: yes

# ── Camera Paths ───────────────────────────────────────────────────────────────
paths:

  # ── SIMULATION STREAM 2 — Wet Process Area ─────────────────────────────────
  cam_wet:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=green@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_wet
    runOnInitRestart: yes

  # ── SIMULATION STREAM 3 — LTJ Warehouse ────────────────────────────────────
  cam_warehouse:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=red@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_warehouse
    runOnInitRestart: yes

  # ── SIMULATION STREAM 1 — Gate 1 / Receiving Area ──────────────────────────
  # CATATAN PENTING: path ini HARUS berupa lavfi loop mandiri (sama seperti
  # cam_wet dan cam_warehouse), BUKAN proxy ke kamera fisik. Kamera real
  # (TP-Link Tapo) untuk snapshot capture diakses LANGSUNG via
  # CctvCamera.rtsp_url_real, TANPA melalui mediamtx, ditentukan oleh kolom
  # is_simulation PER-KAMERA (lihat CctvCamera::isSimulationCamera() dan
  # ::getEffectiveRtspUrlAttribute()). Path live_gate1 di bawah adalah proxy
  # TERPISAH khusus untuk live-view HLS kamera fisik — sengaja dipisah dari
  # path ini agar tidak saling bentrok nama. Jika path cam_gate1 ini justru
  # diarahkan ke RTSP kamera fisik yang tidak reachable, seluruh snapshot
  # simulasi utk stage receiving akan gagal/flaky (root cause insiden
  # rtsp_not_ready — lihat changelog Bagian 12).
  cam_gate1:
    source:          publisher
    sourceOnDemand:  no
    runOnInit: >-
      ffmpeg -f lavfi
      -i testsrc2=size=1280x720:rate=15
      -vf "drawbox=x=0:y=0:w=iw:h=60:color=blue@0.6:t=fill,
           drawbox=x=0:y=0:w=iw:h=60:color=black@0.4:t=fill"
      -c:v libx264 -preset ultrafast -tune zerolatency
      -b:v 800k -maxrate 900k -bufsize 1600k -g 30
      -f rtsp rtsp://localhost:8554/cam_gate1
    runOnInitRestart: yes

  # ── LIVE CAMERA — TP-Link Tapo C500 (Gate 1 / Receiving Area) ──────────────
  # Proxy live-view HLS untuk kamera fisik ASLI — dipakai CctvMonitor.vue
  # saat CctvCamera untuk stage 'receiving' punya is_simulation=false.
  # Snapshot capture (CaptureCctvSnapshotJob) TIDAK melalui path ini — job
  # tersebut konek langsung ke kredensial kamera (rtsp_url_real) dari host,
  # bypass mediamtx sepenuhnya, agar snapshot tidak bergantung pada state
  # proxy ini. Path ini SEMATA-MATA untuk live streaming di browser (HLS),
  # karena browser tidak bisa memutar RTSP mentah secara langsung.
  #
  # sourceOnDemand: no → mediamtx menjaga koneksi tetap standby, mencegah
  # 404 saat frontend memanggil index.m3u8 pertama kali.
  live_gate1:
    source:                       rtsp://admin_minetra:Tapo123!@192.168.18.38/stream2
    sourceOnDemand:               no
    sourceOnDemandStartTimeout:   15s
    sourceOnDemandCloseAfter:     60s
    sourceProtocol:               tcp

# mediamtx.prod.yml — MediaMTX config untuk MINETRACE PRODUCTION (Phase 2)
# Konfigurasi ini menghubungkan kamera fisik Tapo C500 ke sistem dan
# memetakan stream tersebut ke berbagai path untuk kebutuhan UI.

# ── Ports ──────────────────────────────────────────────────────────────
rtspAddress:    :8554
rtmpAddress:    :1935
hlsAddress:     :8888
webrtcAddress:  :8889
apiAddress:     :9997

# ── Security ─────────────────────────────────────────────────────────
authInternalUsers:
  - user: any
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics

# ── API & Metrics ────────────────────────────────────────────────────
api:     yes
metrics: yes
metricsAddress: :9998

# ── Logging ──────────────────────────────────────────────────────────
logLevel:        warn
logDestinations: [stdout]

# ── HLS ──────────────────────────────────────────────────────────────
hls:                yes
hlsSegmentCount:    7
hlsSegmentDuration: 1s
hlsPartDuration:    200ms
hlsAllowOrigins:
  - 'https://mining-traceability.com'
  - 'https://www.mining-traceability.com'
hlsEncryption:      no

# ── WebRTC ───────────────────────────────────────────────────────────
webrtc: yes

# ── Camera Paths — PHYSICAL TAPO C500 INTEGRATION ────────────────────
paths:

  # ── PHYSICAL CAMERA SOURCE — Utama ───────────────────────────────────
  live_gate1:
    source: rtsp://admin_minetra:Tapo123%21@192.168.18.38/stream2
    sourceProtocol: tcp

  # ── ALIAS PATHS — Menggunakan stream fisik yang sama ──────────────────
  # Semua path di bawah ini tidak menjalankan FFmpeg sendiri (hemat CPU),
  # melainkan mengambil dari source live_gate1.
  
  cam_gate1:
    source: rtsp://localhost:8554/live_gate1
    
  cam_wet:
    source: rtsp://localhost:8554/live_gate1

  cam_warehouse:
    source: rtsp://localhost:8554/live_gate1
